name: Update README Age

on:
  schedule:
    - cron: '0 17 12 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run age update script
        run: node .github/scripts/update-age.js

      - name: Commit and push changes
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'Automatic: Update age in README.md'
          branch: main
          commit_options: '--allow-empty'
          skip_dirty_check: true
